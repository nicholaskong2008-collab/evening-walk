<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign item_url = item.url | relative_url %}
        {% assign page_url = page.url | relative_url %}
        <a href="{{ item_url }}"{% if page_url == item_url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch light or dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </nav>
  </div>
</header>

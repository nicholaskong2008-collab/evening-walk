<!doctype html>
<html lang="en-GB">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.charts or content contains 'data-chart=' %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="{{ '/assets/js/charts.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
